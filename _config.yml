title: "Notas técnicas"
description: "Archivo técnico de Alberto Jorge Galindo Barboza con notas y explicaciones sobre epidemiología, virología, diagnóstico, muestreo y análisis."
author: "Alberto Jorge Galindo Barboza"
author_citation: "Galindo Barboza, A. J."
lang: "es-MX"
url: "https://aljogaba.github.io"
baseurl: "/notas-tecnicas"
permalink: /:slug/
timezone: America/Mexico_City

profile_url: "https://aljogaba.github.io/"
episuis_url: "https://episuis.com.mx/"

plugins:
  - jekyll-feed
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      type: "Nota técnica"
      robots: "index,follow,max-image-preview:large"
  - scope:
      path: ""
    values:
      robots: "index,follow,max-image-preview:large"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
