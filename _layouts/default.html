<!doctype html>
<html lang="{{ site.lang | default: 'es-MX' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | escape }}">
  <meta name="author" content="{{ site.author }}">
  <meta name="theme-color" content="#f3f1eb">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <button class="sidebar-toggle" type="button" aria-controls="site-sidebar" aria-expanded="false">
    <span aria-hidden="true">☰</span> Índice
  </button>

  <div class="site-shell">
    {% include sidebar.html %}
    <main class="main-content" id="main-content">
      {{ content }}
    </main>
  </div>

  <script src="{{ '/assets/js/filter.js' | relative_url }}" defer></script>
</body>
</html>
