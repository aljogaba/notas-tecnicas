<!doctype html>
<html lang="{{ site.lang | default: 'es-MX' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | escape }}">
  <meta name="author" content="{{ site.author }}">
  <meta name="theme-color" content="#f3f1eb">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon/favicon.svg' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon/favicon-32.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/favicon/apple-touch-icon.png' | relative_url }}">

  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  {% if page.image %}<meta property="og:image" content="{{ page.image | absolute_url }}">{% endif %}
  <meta name="twitter:card" content="{% if page.image %}summary_large_image{% else %}summary{% endif %}">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <button class="sidebar-toggle" type="button" aria-controls="site-sidebar" aria-expanded="false">
    <span aria-hidden="true">☰</span> Índice
  </button>

  <div class="site-shell">
    {% include sidebar.html %}
    <div class="content-column">
      <main class="main-content" id="main-content">
        {{ content }}
      </main>
      {% unless page.layout == 'post' %}
        {% include site-footer.html %}
      {% endunless %}
    </div>
  </div>

  <script src="{{ '/assets/js/filter.js' | relative_url }}" defer></script>
</body>
</html>
